name: Build and Push Docker Images

on:
  push:
    branches: [ main, cutover-modular-ai-gateway ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_GATEWAY: ${{ github.repository_owner }}/research-ai-runtime-gateway
  IMAGE_MEDIA: ${{ github.repository_owner }}/research-ai-runtime-media
  IMAGE_GATEWAY_BASE: ${{ github.repository_owner }}/research-ai-runtime-gateway-base

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      media: ${{ steps.filter.outputs.media }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'services/ai-gateway/**'
              - 'packages/contracts/**'
              - '.github/workflows/docker.yml'
            media:
              - 'services/research-media/**'
              - 'packages/contracts/**'
              - '.github/workflows/docker.yml'

  build-gateway:
    needs: changes
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (needs.changes.outputs.gateway == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_GATEWAY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push ai-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-media:
    needs: changes
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (needs.changes.outputs.media == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_MEDIA }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and push research-media
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/research-media/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-gateway-cutover-base:
    if: ${{ github.ref == 'refs/heads/cutover-modular-ai-gateway' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pinned cutover base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai-gateway/Dockerfile.cutover-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_GATEWAY_BASE }}:20260915
            ${{ env.REGISTRY }}/${{ env.IMAGE_GATEWAY_BASE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=cutover-base
          cache-to: type=gha,mode=max,scope=cutover-base

  build-gateway-cutover:
    needs: build-gateway-cutover-base
    if: ${{ github.ref == 'refs/heads/cutover-modular-ai-gateway' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract cutover metadata
        id: cutover-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_GATEWAY }}
          tags: |
            type=raw,value=cutover-${{ github.sha }}
            type=raw,value=cutover-latest,enable=${{ github.ref == 'refs/heads/cutover-modular-ai-gateway' }}

      - name: Build and push qualified cutover gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai-gateway/Dockerfile.cutover
          platforms: linux/amd64
          push: true
          build-args: |
            CUTOVER_BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_GATEWAY_BASE }}:20260915
          tags: ${{ steps.cutover-meta.outputs.tags }}
          labels: ${{ steps.cutover-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

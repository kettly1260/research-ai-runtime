# Logical model registry for the AI Gateway — SINGLE SOURCE OF TRUTH.
#
# This file is the authoritative logical model registry for the modular gateway
# (`MODELS_CONFIG_PATH`). It is a deliberate, exact mirror of the production
# legacy registry at /mnt/user/appdata/ovms/runtime/model_registry.json, so the
# legacy -> modular cutover does not change the served model set, the OVMS
# model mapping, or any backend routing decision.
#
# Maintenance rules:
#   1. Edit THIS file to add/remove/retarget a logical model. Do not reintroduce
#      a second authority (the runtime JSON) for the modular deployment.
#   2. Only list models that actually exist in production OVMS. A listed model is
#      advertised by GET /v1/models and routed by POST /v1/embeddings, so listing
#      an undeployed model exposes it as falsely available.
#   3. Do NOT add `idle_ttl` unless you intend to override the global
#      MODEL_IDLE_UNLOAD_SECONDS for that model. Production sets no per-model
#      TTL, so the gateway must fall back to the env value (1200s) to stay in
#      parity. Adding `idle_ttl` here silently shortens residency.
#
# `policy` is one of: GPU_ONLY | CPU_ONLY | GPU_PREFERRED | CPU_PREFERRED | BURST_BOTH
# Device-broker budgets (CPU semaphore, thread budget, queue depth) come from
# environment variables, not from this file.

models:

  # ------------------------------------------------------------------ rerank
  qwen-reranker:
    model_id: qwen-reranker
    type: rerank
    ovms_model: qwen-reranker
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

  # ------------------------------------------- bge-m3 (two ids, one model)
  bge-m3-i8:
    model_id: bge-m3-i8
    type: embedding
    ovms_model: bge-m3-i8
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

  bge-m3:
    model_id: bge-m3
    type: embedding
    # Same physical OVMS model as bge-m3-i8; kept as a separate logical id
    # because production clients address it by this name.
    ovms_model: bge-m3-i8
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

  # ------------------------------------- Qwen3 embeddings (graph / genai_v3)
  qwen3-embedding-0.6b-int8:
    model_id: qwen3-embedding-0.6b-int8
    type: embedding
    # Graph-backed OVMS model served through the OpenAI-compatible
    # /v3/embeddings endpoint (embedding_backend: genai_v3).
    ovms_model: qwen3-embedding-0.6b
    embedding_backend: genai_v3
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

  # -------------------------------------- Qwen3 embeddings (pooled IR path)
  qwen3-embedding-0.6b-int4:
    model_id: qwen3-embedding-0.6b-int4
    type: embedding
    ovms_model: qwen3-embedding-0.6b-int4-pooled
    embedding_backend: pooled_ir
    adaptive_batching: true
    tokenizer_path: /models/OpenVINO/Qwen3-Embedding-0.6B-int4-cw-ov
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

  # ------------------------------- Arctic sentence-transformer text embedding
  arctic-embed-m-v2-int8:
    model_id: arctic-embed-m-v2-int8
    type: embedding
    ovms_model: arctic-embed-m-v2-int8
    embedding_backend: sentence_transformer
    tokenizer_path: /models/Snowflake/snowflake-arctic-embed-m-v2.0-test
    max_length: 8192
    batch_size: 2
    query_prefix: "query: "
    owned_by: openvino
    preferred_device: GPU
    fallback_device: CPU
    policy: GPU_PREFERRED

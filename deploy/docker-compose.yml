# Full-stack compose file for fresh/dev environments.
#
# ############################################################################
# # DO NOT RUN THIS FILE ON THE PRODUCTION UNRAID HOST.                     #
# #                                                                          #
# # The `ovms` service below declares `container_name: ovms-server` with a    #
# # command that does NOT match the running production container, so          #
# # `docker compose up -d` would RECREATE (and therefore restart) OVMS.       #
# #                                                                          #
# # Production deploys the gateway only, via:                                 #
# #   docker compose -f deploy/docker-compose.production.yml \                #
# #       up -d --no-deps ai-gateway                                          #
# ############################################################################

services:
  ovms:
    # NEVER use `openvino/model_server:latest-gpu` in a deployment example.
    # `latest-gpu` has already drifted from OVMS 2026.1 to 2026.3.1, which
    # removes the Classic Model REST API this gateway's `tfs` protocol depends
    # on.  A tag is not a compatibility contract: pin a validated tag, and for
    # production pin the validated digest
    # (openvino/model_server@sha256:<validated digest>).
    image: ${OVMS_IMAGE:-openvino/model_server:2026.1-gpu}
    container_name: ovms-server
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/user/appdata/ovms/models:/models:rw
      - /mnt/user/appdata/ovms/runtime:/ovms-config:rw
    environment:
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1
      - UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS=1
      - SYCL_PI_LEVEL_ZERO_DEVICE_SCOPE_EVENTS=0
      - UR_L0_USE_IMMEDIATE_COMMANDLISTS=1
    command: >
      --config_path /ovms-config/config.json
      --file_system_poll_wait_seconds 1
      --rest_port 8001
    ports:
      - "${OVMS_REST_PORT:-28331}:8001"
    networks:
      - ai_network

  ai-gateway:
    build:
      context: ..
      dockerfile: services/ai-gateway/Dockerfile
    image: ghcr.io/kettly1260/research-ai-runtime-gateway:latest
    container_name: ai-gateway
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/ovms/models:/models:ro
      - /mnt/user/appdata/ovms/runtime:/ovms-config:rw
      - /mnt/user/appdata/ovms/tokenizers:/tokenizers:ro
      - ../config:/config:ro
    ports:
      - "${AI_GATEWAY_PORT:-28001}:8000"
    environment:
      - OVMS_BASE=${OVMS_BASE:-http://ovms-server:8001}
      - OVMS_TIMEOUT=${OVMS_TIMEOUT:-120}
      - MODELS_CONFIG_PATH=/config/models.yaml
      - OVMS_CONFIG_PATH=/ovms-config/config.json
      - OVMS_MODEL_CATALOG_PATH=/ovms-config/model_catalog.json
      - OVMS_CONFIG_UPDATE_MODE=${OVMS_CONFIG_UPDATE_MODE:-poll}
      # Classic Model wire protocol: tfs (OVMS 2026.1) or kserve (OVMS 2026.3+).
      # `auto` is for development/acceptance/CI only; production pins a value.
      - OVMS_PROTOCOL=${OVMS_PROTOCOL:-tfs}
      - BGE_TOKENIZER_PATH=/tokenizers/bge-m3
      - RERANK_TOKENIZER_PATH=/tokenizers/qwen-reranker
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      # Production baseline values; see deploy/env.example for the rationale.
      - MODEL_IDLE_UNLOAD_SECONDS=${MODEL_IDLE_UNLOAD_SECONDS:-1200}
      - MAX_LOADED_MODELS=${MAX_LOADED_MODELS:-2}
      - MODEL_IDLE_SWEEP_SECONDS=${MODEL_IDLE_SWEEP_SECONDS:-60}
      - RERANK_STRICT_RECALL=${RERANK_STRICT_RECALL:-1}
      - RERANK_MAX_DOCS=${RERANK_MAX_DOCS:-64}
      - RERANK_MAX_LENGTH=${RERANK_MAX_LENGTH:-128}
      - RERANK_MAX_CHARS=${RERANK_MAX_CHARS:-1000}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:-1}
      - RERANK_FALLBACK_MAX_LENGTH=${RERANK_FALLBACK_MAX_LENGTH:-96}
      - RERANK_FALLBACK_TIMEOUT=${RERANK_FALLBACK_TIMEOUT:-180}
      - BGE_MAX_TOTAL_TOKENS=${BGE_MAX_TOTAL_TOKENS:-8192}
      - BGE_CHUNK_TOKENS=${BGE_CHUNK_TOKENS:-1024}
      - BGE_CHUNK_OVERLAP=${BGE_CHUNK_OVERLAP:-128}
      - BGE_BATCH_SIZE=${BGE_BATCH_SIZE:-8}
      - TOKENIZERS_PARALLELISM=true
    depends_on:
      - ovms
    networks:
      - ai_network

  research-media:
    build:
      context: ..
      dockerfile: services/research-media/Dockerfile
    image: ghcr.io/kettly1260/research-ai-runtime-media:latest
    container_name: research-media
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/research-media/data:/data/media.lance:rw
      - ../config:/config:ro
    ports:
      - "${RESEARCH_MEDIA_PORT:-28003}:8002"
    environment:
      - AI_GATEWAY_ENDPOINT=${AI_GATEWAY_ENDPOINT:-http://ai-gateway:8000}
      - PARSER_CONFIG_PATH=${PARSER_CONFIG_PATH:-/config/providers.yaml}
      - MODELS_CONFIG_PATH=${MODELS_CONFIG_PATH:-/config/models.yaml}
      - MEDIA_DATA_DIR=/data/media.lance
      - MINERU_API_KEY=${MINERU_API_KEY:-}
      - MINERU_ENDPOINT=${MINERU_ENDPOINT:-}
      - PADDLEOCR_API_KEY=${PADDLEOCR_API_KEY:-}
      - PADDLEOCR_ENDPOINT=${PADDLEOCR_ENDPOINT:-}
      - LOCAL_MINERU_ENDPOINT=${LOCAL_MINERU_ENDPOINT:-}
      - LOCAL_PADDLE_ENDPOINT=${LOCAL_PADDLE_ENDPOINT:-}
    depends_on:
      - ai-gateway
    networks:
      - ai_network

networks:
  ai_network:
    external: true

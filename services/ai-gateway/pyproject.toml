[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-ai-gateway"
version = "0.2.0"
description = "Universal AI inference gateway with GPU-first and CPU spillover broker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "contracts",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "transformers>=4.35.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "protobuf>=4.25.0,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["research_ai_gateway"]

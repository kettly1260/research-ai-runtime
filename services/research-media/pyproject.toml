[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-media"
version = "0.2.0"
description = "Research media indexing, figure parsing, and multimodal LanceDB retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "contracts",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "pillow>=9.5.0",
    "lancedb>=0.5.0",
    "pyarrow>=14.0.0",
    "jmespath>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["research_media"]
